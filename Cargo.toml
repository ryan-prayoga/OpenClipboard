[package]
name = "openclipboard"
version = "0.1.5"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
bincode = "1.3"
global-hotkey = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSGlassEffectView", "NSView", "NSResponder"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[profile.release]
# Older Rust toolchains can produce misaligned Mach-O libraries when stripping
# build-time proc macros on macOS 27 (rust-lang/rust#157750).
strip = "none"
